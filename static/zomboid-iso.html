<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Zomboid — Isometric Map</title>
  <script src="/static/iso/openseadragon/openseadragon.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13; --surface: #1a1a21; --surface2: #22222c;
      --border: #2e2e3a; --accent: #ef4444; --green: #22c55e;
      --text: #e2e2e8; --muted: #6b6b7a;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; overflow: hidden; }

    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .topbar-title { font-size: 15px; font-weight: 700; }
    .topbar-title span { color: var(--accent); }
    .topbar-sep { width: 1px; height: 20px; background: var(--border); }

    select, button.ctrl { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 5px; font-size: 12px; cursor: pointer; }
    button.ctrl:hover { border-color: #4e4e5e; }
    button.ctrl.active { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.5); color: var(--accent); }

    label.toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
    label.toggle input { accent-color: var(--accent); }
    label.toggle:hover { color: var(--text); }

    .spacer { flex: 1; }

    #viewer-wrap { flex: 1; position: relative; overflow: hidden; }
    #osd { width: 100%; height: 100%; background: #0a0a0e; }

    /* Marker styles */
    .iso-marker { position: absolute; pointer-events: none; transform: translate(-50%, -50%); }
    .iso-marker.player { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #000; box-shadow: 0 0 8px currentColor; }
    .iso-marker.player.alive   { background: #22c55e; color: #22c55e; }
    .iso-marker.player.bitten  { background: #ef4444; color: #ef4444; }
    .iso-marker.player.dead    { background: #6b7280; color: #6b7280; }
    .iso-marker.player.offline { background: #6b7280; color: #6b7280; opacity: 0.5; }
    .iso-marker.death  { font-size: 11px; line-height: 1; }
    .iso-marker.fire   { font-size: 13px; line-height: 1; }
    .iso-marker.farm   { font-size: 11px; line-height: 1; }
    .iso-marker.trap   { font-size: 11px; line-height: 1; }
    .iso-marker.rare   { font-size: 13px; line-height: 1; filter: drop-shadow(0 0 3px #fde047); }
    .iso-marker.crate  { font-size: 12px; line-height: 1; cursor: help; }

    .iso-label { position: absolute; pointer-events: none; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 700; color: #22c55e; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 6px #000; top: 10px; left: 50%; }
    .iso-label.bitten   { color: #ef4444; }
    .iso-label.dead     { color: #9ca3af; }
    .iso-label.offline  { color: #9ca3af; opacity: 0.55; }
    .iso-marker.vehicle { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; border: 1px solid #000; box-shadow: 0 0 4px #fbbf24; }
    .iso-marker.town-label { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid; background: rgba(0,0,0,0.5); white-space: nowrap; text-shadow: 0 0 4px #000; }
    .iso-marker.town-box { position: absolute; transform: none; }

    #status { position: absolute; bottom: 10px; right: 12px; font-size: 11px; color: var(--muted); background: rgba(15,15,19,0.8); padding: 4px 8px; border-radius: 5px; border: 1px solid var(--border); }
    #coords-display { font-size: 11px; color: var(--muted); }

    .legend { font-size: 11px; color: var(--muted); }

  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-title">Project <span>Zomboid</span> — Iso Map</div>
    <div class="topbar-sep"></div>

    <select id="layer-sel" onchange="setLayer(+this.value)">
      <option value="0">Ground Floor</option>
      <option value="1">Floor 1</option>
      <option value="2">Floor 2</option>
      <option value="3">Floor 3</option>
      <option value="4">Floor 4</option>
      <option value="5">Floor 5</option>
      <option value="6">Floor 6</option>
      <option value="7">Floor 7</option>
    </select>

    <input type="range" id="roof-opacity" min="0" max="100" value="0" step="10"
      title="Roof opacity" oninput="setRoofOpacity(+this.value)"
      style="width:80px;accent-color:var(--accent);">

    <div class="topbar-sep"></div>

    <label class="toggle"><input type="checkbox" id="show-players" onchange="saveToggles();redrawMarkers()"> Players</label>
    <label class="toggle"><input type="checkbox" id="show-vehicles" onchange="saveToggles();redrawMarkers()"> Vehicles</label>
    <label class="toggle"><input type="checkbox" id="show-wrecks" onchange="saveToggles();redrawMarkers()"> Wrecks</label>
    <label class="toggle"><input type="checkbox" id="show-deaths" onchange="saveToggles();redrawMarkers()"> Deaths</label>
    <label class="toggle"><input type="checkbox" id="show-campfires" onchange="saveToggles();redrawMarkers()"> Campfires</label>
    <label class="toggle"><input type="checkbox" id="show-farming" onchange="saveToggles();redrawMarkers()"> Farming</label>
    <label class="toggle"><input type="checkbox" id="show-traps" onchange="saveToggles();redrawMarkers()"> Traps</label>
    <label class="toggle"><input type="checkbox" id="show-towns" onchange="saveToggles();redrawMarkers()"> Towns</label>
    <label class="toggle"><input type="checkbox" id="show-heatmap" onchange="saveToggles();redrawMarkers()"> Heatmap</label>
    <label class="toggle"><input type="checkbox" id="show-rare" checked onchange="saveToggles();redrawMarkers()"> Rare</label>
    <label class="toggle"><input type="checkbox" id="show-crates" onchange="saveToggles();redrawMarkers()"> Crates</label>

    <div class="topbar-sep"></div>
    <div class="legend">🟢 alive &nbsp;🔴 bitten &nbsp;💀 death &nbsp;🔵🟡🔴 vehicle &nbsp;⬜ wreck &nbsp;🔥 fire &nbsp;🌿 farm &nbsp;🕷 trap</div>

    <div class="spacer"></div>
    <div id="coords-display">—</div>
    <a href="/zomboid" style="font-size:12px;color:var(--muted);text-decoration:none;" title="Back to full map">← Full Map</a>
  </div>

  <div id="viewer-wrap">
    <div id="osd"></div>
    <canvas id="heatmap-canvas" style="position:absolute;top:0;left:0;pointer-events:none;"></canvas>
    <canvas id="towns-canvas" style="position:absolute;top:0;left:0;pointer-events:none;"></canvas>
    <div id="status">Loading...</div>
  </div>

  <script type="module">
    const API_BASE = window.location.hostname === 'm.gameznet.looknet.ca'
      ? 'https://gameznet.looknet.ca' : '';

    // ── Map config ────────────────────────────────────────────────────────────
    // Cell range rendered: cx=19-23, cy=17-22 (4x5)
    // Coordinate constants from map_info.json (authoritative, written by pzmap2dzi):
    //   gx = sx - sy,  gy = sx + sy
    //   pixel_x = x0 + gx * GW,  pixel_y = y0 + gy * GH + layer * LH
    //   sqr=128 px/square, GW=64, GH=32, LH=192
    // Base (full-resolution) geometry constants. When the render omits the N deepest
    // pyramid levels (map_info.skip), the DZI base image is downscaled by 2^N, so all
    // pixel coordinates (x0/y0/GW/GH/LH) must be divided by the same factor.
    const BASE_GEOM = { GW: 64, GH: 32, LH: 192 };
    let MAP_CONF = {
      GW: 64, GH: 32, LH: 192,
      x0: 618496, y0: -229408,
    };

    let dziInfo = null;  // loaded from layer0.dzi
    let viewer = null;
    let viewerReady = false;
    let currentLayer = 0;
    let layerItems = [];  // OSD world items per layer
    let markerEls = [];   // DOM marker elements
    let pzData = { players: [], overlays: {}, rare: { spawns: [] }, storage: { containers: [] } };

    async function loadDziInfo() {
      try {
        const [dziRes, infoRes] = await Promise.all([
          fetch('/static/map-tiles/iso/base/layer0.dzi'),
          fetch('/static/map-tiles/iso/base/map_info.json'),
        ]);
        const txt = await dziRes.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(txt, 'text/xml');
        const img = xml.querySelector('Image');
        const size = xml.querySelector('Size');
        dziInfo = {
          tileSize: +img.getAttribute('TileSize'),
          overlap: +img.getAttribute('Overlap'),
          format: img.getAttribute('Format'),
          width: +size.getAttribute('Width'),
          height: +size.getAttribute('Height'),
        };
        // Load authoritative coordinate offsets from pzmap2dzi output.
        // skip = omitted deepest pyramid levels; base image is downscaled by 2^skip,
        // so x0/y0 and the GW/GH/LH constants must be scaled to the base image's pixel space.
        const info = await infoRes.json();
        const skip = info.skip || 0;
        const f = Math.pow(2, skip);
        MAP_CONF.x0 = info.x0 / f;
        MAP_CONF.y0 = info.y0 / f;
        MAP_CONF.GW = BASE_GEOM.GW / f;
        MAP_CONF.GH = BASE_GEOM.GH / f;
        MAP_CONF.LH = BASE_GEOM.LH / f;
        // cell_rects: [[x, y, width, height]] in cell coords (pzmap2dzi format; 1 cell = 300 squares)
        if (info.cell_rects && info.cell_rects[0]) {
          const [cx, cy, cw, ch] = info.cell_rects[0];
          MAP_CONF.bounds = { xMin: cx * 300, yMin: cy * 300, xMax: (cx + cw) * 300, yMax: (cy + ch) * 300 };
        }
      } catch(e) {
        console.warn('DZI load failed', e);
      }
    }

    // Convert game square coords to DZI image pixel coords (0..1 viewport fraction).
    // Always use the currently visible layer's world item for coordinate conversion
    // so that zoom-dependent tile loading doesn't cause offset drift.
    function squareToViewport(sx, sy, layer) {
      if (!dziInfo || !viewer) return null;
      const { GW, GH, LH, x0, y0 } = MAP_CONF;
      const gx = sx - sy;
      const gy = sx + sy;
      const px = x0 + gx * GW;
      const py = y0 + gy * GH - (layer || 0) * LH;
      const item = viewer.world.getItemAt(0);
      if (!item) return null;
      const vp = item.imageToViewportCoordinates(px, py);
      return vp;
    }

const TOWN_ZONES = [
      { name: 'Muldraugh',  cx0: 34, cy0: 30, cx1: 37, cy1: 36 },
      { name: 'Riverside',  cx0: 16, cy0: 17, cx1: 23, cy1: 22 },
      { name: 'Rosewood',   cx0: 25, cy0: 37, cx1: 29, cy1: 40 },
      { name: 'West Point', cx0: 36, cy0: 21, cx1: 41, cy1: 24 },
    ];
    const TOWN_COLORS = ['#60a5fa','#34d399','#f472b6','#fbbf24'];

    function clearMarkers() {
      markerEls.forEach(el => { try { viewer.removeOverlay(el); } catch(e) {} el.remove(); });
      markerEls = [];
    }

    function addOverlay(sx, sy, layer, html, cls, placement) {
      const vp = squareToViewport(sx, sy, layer);
      if (!vp) return null;
      const el = document.createElement('div');
      el.className = 'iso-marker ' + cls;
      el.innerHTML = html;
      viewer.addOverlay({
        element: el,
        location: vp,
        placement: placement || OpenSeadragon.Placement.CENTER,
      });
      markerEls.push(el);
      return el;
    }

    function redrawMarkers() {
      clearMarkers();
      if (!viewer || !dziInfo || !viewerReady) return;
      const showPlayers   = document.getElementById('show-players')?.checked;
      const showVehicles  = document.getElementById('show-vehicles')?.checked;
      const showDeaths    = document.getElementById('show-deaths')?.checked;
      const showCampfires = document.getElementById('show-campfires')?.checked;
      const showFarming   = document.getElementById('show-farming')?.checked;
      const showTraps     = document.getElementById('show-traps')?.checked;
      const showTowns     = document.getElementById('show-towns')?.checked;
      const showHeatmap   = document.getElementById('show-heatmap')?.checked;
      const showRare      = document.getElementById('show-rare')?.checked;
      const showCrates    = document.getElementById('show-crates')?.checked;

      const ovl = pzData.overlays || {};

      if (showPlayers) {
        (pzData.players || []).forEach(p => {
          if (p.x == null || p.y == null) return;
          const online = p.isOnline !== false;
          const cls = p.isDead ? 'player dead' : p.infected_risk ? 'player bitten' : online ? 'player alive' : 'player offline';
          const layer = p.z || 0;
          const el = addOverlay(p.x, p.y, layer, '', cls);
          if (el) {
            const lbl = document.createElement('div');
            lbl.className = 'iso-label' + (p.infected_risk ? ' bitten' : p.isDead ? ' dead' : !online ? ' offline' : '');
            if (!online && p.lastConnection) {
              const ago = Math.round((Date.now() - new Date(p.lastConnection + 'Z').getTime()) / 60000);
              const agoStr = ago < 60 ? `${ago}m ago` : `${Math.round(ago/60)}h ago`;
              lbl.textContent = p.name + ` (${agoStr})`;
            } else {
              lbl.textContent = p.name + (p.infected_risk ? ' ⚠' : '');
            }
            el.appendChild(lbl);
          }
        });
      }

      const isDestroyed = v => { const vals = Object.values(v.parts || {}); return vals.length === 0 || vals.every(c => c === 0); };
      if (showVehicles || document.getElementById('show-wrecks')?.checked) {
        const showWrecks = document.getElementById('show-wrecks')?.checked;
        const b = MAP_CONF.bounds;
        const vlist = (ovl.vehicles || []).filter(v => {
          if (b && (v.x < b.xMin || v.x > b.xMax || v.y < b.yMin || v.y > b.yMax)) return false;
          const d = isDestroyed(v);
          return (d && showWrecks) || (!d && showVehicles);
        });
        const CHUNK = 20;
        let vi = 0;
        const addVehicleChunk = () => {
          const end = Math.min(vi + CHUNK, vlist.length);
          for (; vi < end; vi++) {
            const v = vlist[vi];
            const destroyed = isDestroyed(v);
            const engine = v.parts?.Engine ?? 0;
            const color = destroyed ? '#6b7280' : engine > 0.6 ? '#60a5fa' : engine > 0.3 ? '#f59e0b' : '#ef4444';
            const el = addOverlay(v.x, v.y, 0, '', 'vehicle');
            if (el) {
              el.style.background = color;
              el.style.boxShadow = `0 0 4px ${color}`;
              el.style.opacity = destroyed ? '0.5' : '0.85';
              if (v.type) {
                const lbl = document.createElement('div');
                lbl.className = 'iso-label';
                lbl.style.cssText = `color:#fff;background:rgba(0,0,0,0.65);padding:1px 4px;border-radius:3px;font-size:9px;`;
                lbl.textContent = v.type;
                el.appendChild(lbl);
              }
            }
          }
          if (vi < vlist.length) setTimeout(addVehicleChunk, 0);
        };
        setTimeout(addVehicleChunk, 0);
      }

      if (showDeaths) {
        const dead = (ovl.dead || []).slice(-5);
        dead.forEach(d => {
          const el = addOverlay(d.x, d.y, 0, '💀', 'death');
          if (el) {
            const lbl = document.createElement('div');
            lbl.className = 'iso-label dead';
            // PZ log format: "[MM-DD-YY HH:MM:SS." — extract and reformat
            let ts = '';
            if (d.ts) {
              const m = d.ts.match(/\[(\d{2})-(\d{2})-(\d{2})\s+(\d{2}:\d{2})/);
              if (m) ts = `${m[1]}/${m[2]} ${m[4]}`;
            }
            lbl.textContent = d.name + (ts ? ` ${ts}` : '');
            el.appendChild(lbl);
          }
        });
      }

      if (showCampfires) {
        (ovl.campfires || []).forEach(pt => addOverlay(pt.x, pt.y, 0, '🔥', 'fire'));
        (ovl.drums     || []).forEach(pt => addOverlay(pt.x, pt.y, 0, '🛢', 'fire'));
        (ovl.barrels   || []).forEach(pt => addOverlay(pt.x, pt.y, 0, '💧', 'fire'));
      }

      if (showFarming) {
        (ovl.farming || []).forEach(pt => addOverlay(pt.x, pt.y, 0, '🌿', 'farm'));
      }

      if (showTraps) {
        (ovl.traps || []).forEach(pt => addOverlay(pt.x, pt.y, 0, '🕷', 'trap'));
      }

      if (showRare) {
        (pzData.rare?.spawns || []).forEach(s => {
          if (s.x == null || s.y == null) return;
          const icon = s.kind === 'zombie' ? '🧟' : s.kind === 'ground' ? '🎒' : '💎';
          const el = addOverlay(s.x, s.y, s.z || 0, icon, 'rare');
          if (el) {
            const lbl = document.createElement('div');
            lbl.className = 'iso-label';
            lbl.style.cssText = 'color:#fde047;background:rgba(0,0,0,0.7);padding:1px 4px;border-radius:3px;font-size:9px;';
            lbl.textContent = s.kind === 'zombie' ? (s.why || 'special') : (s.label || s.item || 'rare');
            el.appendChild(lbl);
          }
        });
      }

      if (showCrates) {
        (pzData.storage?.containers || []).forEach(c => {
          if (c.x == null || c.y == null) return;
          const el = addOverlay(c.x, c.y, c.z || 0, '📦', 'crate');
          if (el) {
            const items = c.items || {};
            const total = Object.values(items).reduce((s, n) => s + n, 0);
            const lines = Object.entries(items)
              .sort((a, b) => b[1] - a[1])
              .map(([ft, n]) => `${ft.replace(/^Base\./, '')} x${n}`)
              .join('\n');
            el.title = `Crate (${total} items)\n${lines}`;
          }
        });
      }

      drawTowns(showTowns);
      if (showTowns) {
        TOWN_ZONES.forEach((town, i) => {
          const color = TOWN_COLORS[i % TOWN_COLORS.length];
          const SQ = 300;
          const cx = ((town.cx0 + town.cx1) / 2) * SQ;
          const cy = town.cy0 * SQ;
          const el = addOverlay(cx, cy, 0, '', 'town-label');
          if (el) {
            el.style.color = color;
            el.style.borderColor = color;
            el.textContent = town.name;
          }
        });
      }

      if (showHeatmap) {
        const canvas = document.getElementById('heatmap-canvas');
        drawHeatmap(canvas, ovl.density || [], pzData.liveCells || []);
      } else {
        const canvas = document.getElementById('heatmap-canvas');
        if (canvas) { const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); }
      }
    }

    function drawHeatmap(canvas, density, liveCells) {
      if (!canvas || !viewer || !dziInfo) return;
      const wrap = document.getElementById('viewer-wrap');
      canvas.width = wrap.clientWidth;
      canvas.height = wrap.clientHeight;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const SQ = 300;

      // Build live cell lookup: "cx,cy" -> normalized 0-1
      const liveMap = {};
      if (liveCells && liveCells.length) {
        const maxLive = Math.max(...liveCells.map(c => c.count));
        liveCells.forEach(c => {
          liveMap[`${c.cx},${c.cy}`] = Math.pow(c.count / maxLive, 0.4);
        });
      }

      // Normalize zpop scores to 0-1, skip cells covered by live data
      const zpopCells = (density || []).filter(d => !liveMap[`${d.cx},${d.cy}`]);
      const maxZpop = zpopCells.length ? Math.max(...zpopCells.map(d => d.score)) : 1;

      const drawCell = (cx, cy, t, isLive) => {
        const sx = (cx + 0.5) * SQ;
        const sy = (cy + 0.5) * SQ;
        const vp = squareToViewport(sx, sy, 0);
        if (!vp) return;
        const pt = viewer.viewport.pixelFromPoint(vp);
        const cellVp = squareToViewport((cx + 1) * SQ, (cy + 0.5) * SQ, 0);
        const cellPt = cellVp ? viewer.viewport.pixelFromPoint(cellVp) : null;
        const r = cellPt ? Math.max(4, Math.abs(cellPt.x - pt.x) * 0.8) : 8;

        const grad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, r);
        if (isLive) {
          // Live data: teal-blue — clearly distinct from zpop orange-red
          grad.addColorStop(0, `rgba(56,189,248,${(t * 0.85).toFixed(2)})`);
          grad.addColorStop(0.5, `rgba(99,102,241,${(t * 0.45).toFixed(2)})`);
          grad.addColorStop(1, 'rgba(99,102,241,0)');
        } else {
          // zpop estimate: red-orange
          grad.addColorStop(0, `rgba(239,68,68,${(t * 0.7).toFixed(2)})`);
          grad.addColorStop(0.5, `rgba(251,146,60,${(t * 0.35).toFixed(2)})`);
          grad.addColorStop(1, 'rgba(251,146,60,0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
        ctx.fill();
      };

      // Draw zpop first (underneath), then live on top
      zpopCells.forEach(d => drawCell(d.cx, d.cy, Math.pow(d.score / maxZpop, 0.4), false));
      Object.entries(liveMap).forEach(([key, t]) => {
        const [cx, cy] = key.split(',').map(Number);
        drawCell(cx, cy, t, true);
      });
    }

    function drawTowns(show) {
      const canvas = document.getElementById('towns-canvas');
      if (!canvas || !viewer || !dziInfo) return;
      const wrap = document.getElementById('viewer-wrap');
      canvas.width = wrap.clientWidth;
      canvas.height = wrap.clientHeight;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!show) return;
      const SQ = 300;
      TOWN_ZONES.forEach((town, i) => {
        const color = TOWN_COLORS[i % TOWN_COLORS.length];
        // 4 corners of the cell bounding box in iso space
        const corners = [
          [town.cx0 * SQ, town.cy0 * SQ],
          [town.cx1 * SQ, town.cy0 * SQ],
          [town.cx1 * SQ, town.cy1 * SQ],
          [town.cx0 * SQ, town.cy1 * SQ],
        ];
        const pts = corners.map(([sx, sy]) => {
          const vp = squareToViewport(sx, sy, 0);
          return vp ? viewer.viewport.pixelFromPoint(vp) : null;
        });
        if (pts.some(p => !p)) return;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = color + '18';
        ctx.fill();
      });
    }

    // ── Layer switching ───────────────────────────────────────────────────────
    // Each layer's DZI has its tile grid offset vertically by layer*LAYER_HEIGHT.
    // Loading multiple layers simultaneously causes OSD to composite them, producing
    // the diagonal split-map artifact. Load only the active layer's DZI at a time.
    window.setLayer = function(layer) {
      if (!viewer || layer === currentLayer) return;
      currentLayer = layer;
      const src = `/static/map-tiles/iso/base/layer${layer}.dzi`;
      viewer.world.removeAll();
      viewer.addTiledImage({ tileSource: src, x: 0, y: 0, width: 1 });
    };

    window.setRoofOpacity = function(val) {
      const item = viewer && viewer.world.getItemAt(0);
      if (item) item.setOpacity(val > 0 ? val / 100 : 1);
    };

    // ── Init ──────────────────────────────────────────────────────────────────
    async function init() {
      await loadDziInfo();

      // Probe which layers exist sequentially — stop at first 404 to avoid console spam
      const layerExists = [false,false,false,false,false,false,false,false];
      for (let i = 0; i < 8; i++) {
        const ok = await fetch(`/static/map-tiles/iso/base/layer${i}.dzi`, {method:'HEAD'})
          .then(r => r.ok).catch(() => false);
        if (!ok) break;
        layerExists[i] = true;
      }

      // Populate layer selector with only available layers
      const sel = document.getElementById('layer-sel');
      sel.innerHTML = '';
      layerExists.forEach((exists, i) => {
        if (!exists) return;
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i === 0 ? 'Ground Floor' : `Floor ${i}`;
        sel.appendChild(opt);
      });

      viewer = OpenSeadragon({
        element: document.getElementById('osd'),
        tileSources: `/static/map-tiles/iso/base/layer0.dzi`,
        sequenceMode: false,
        homeFillsViewer: false,
        showZoomControl: false,
        showHomeControl: false,
        showFullPageControl: false,
        showRotationControl: false,
        constrainDuringPan: false,
        visibilityRatio: 0.05,
        prefixUrl: '/static/iso/openseadragon/images/',
        minZoomImageRatio: 0.25,
        maxZoomPixelRatio: 4,
        zoomPerScroll: 1.15,
        smoothingEnabled: false,
        background: '#0a0a0e',
      });

      let _initialOpen = true;
      viewer.addHandler('open', () => {
        viewerReady = true;
        document.getElementById('status').textContent = 'Ready';

        if (_initialOpen) {
          _initialOpen = false;
          // Zoom to content bounds so OSD doesn't show the empty 1.2M canvas
          const { GW, GH, x0, y0 } = MAP_CONF;
          const item0 = viewer.world.getItemAt(0);
          if (item0 && MAP_CONF.bounds) {
            const b = MAP_CONF.bounds;
            const corners = [
              [b.xMin, b.yMin], [b.xMax, b.yMin],
              [b.xMin, b.yMax], [b.xMax, b.yMax],
            ];
            const vps = corners.map(([sx, sy]) => {
              const gx = sx - sy, gy = sx + sy;
              return item0.imageToViewportCoordinates(x0 + gx * GW, y0 + gy * GH);
            });
            const vpXs = vps.map(p => p.x), vpYs = vps.map(p => p.y);
            const vpRect = new OpenSeadragon.Rect(
              Math.min(...vpXs), Math.min(...vpYs),
              Math.max(...vpXs) - Math.min(...vpXs),
              Math.max(...vpYs) - Math.min(...vpYs)
            );
            viewer.viewport.fitBounds(vpRect, true);
          }

          // Jump to URL coords if provided (overrides fitBounds)
          const params = new URLSearchParams(window.location.search);
          const gx = +params.get('x'), gy = +params.get('y');
          if (gx && gy) {
            const vp = squareToViewport(gx, gy, 0);
            if (vp) viewer.viewport.panTo(vp).zoomTo(0.05);
          }
        }

        redrawMarkers();
      });

      viewer.addHandler('resize', redrawMarkers);

      let _canvasRaf = null;
      viewer.addHandler('viewport-change', () => {
        if (_canvasRaf) return;
        _canvasRaf = requestAnimationFrame(() => {
          _canvasRaf = null;
          if (document.getElementById('show-heatmap')?.checked)
            drawHeatmap(document.getElementById('heatmap-canvas'), (pzData.overlays || {}).density || [], pzData.liveCells || []);
          if (document.getElementById('show-towns')?.checked)
            drawTowns(true);
        });
      });

      // Coordinate display on mouse move
      viewer.addHandler('mouse-move', (e) => {
        if (!dziInfo) return;
        const vp = viewer.viewport.pointFromPixel(e.position);
        const item = viewer.world.getItemAt(0);
        if (!item) return;
        const img = item.viewportToImageCoordinates(vp);
        const { GW, GH, x0, y0 } = MAP_CONF;
        // invert: gx = (px - x0) / GW, gy = (py - y0) / GH
        const gx = (img.x - x0) / GW;
        const gy = (img.y - y0) / GH;
        // sx = (gx + gy) / 2, sy = (gy - gx) / 2
        const sx = (gx + gy) / 2;
        const sy = (gy - gx) / 2;
        document.getElementById('coords-display').textContent =
          `X: ${Math.round(sx)}  Y: ${Math.round(sy)}`;
      });

      // Load data — initial full fetch, then SSE for live updates
      loadData();

      // SSE for fast player/vehicle/overlay updates
      let _sseConnected = false;
      function connectSSE() {
        const es = new EventSource(`${API_BASE}/api/pz/stream`);
        es.addEventListener('players', e => {
          try {
            const d = JSON.parse(e.data);
            if (!d.error && d.updated) { pzData.players = d.players || []; redrawMarkers(); updateStatus(); }
          } catch {}
        });
        es.addEventListener('vehicles', e => {
          try {
            const d = JSON.parse(e.data);
            if (!d.error && d.updated) { pzData.overlays.vehicles = d.vehicles || []; redrawMarkers(); }
          } catch {}
        });
        es.addEventListener('overlays', e => {
          try {
            const d = JSON.parse(e.data);
            if (!d.error) { Object.assign(pzData.overlays, d); redrawMarkers(); }
          } catch {}
        });
        es.addEventListener('rare', e => {
          try {
            const d = JSON.parse(e.data);
            if (!d.error) { pzData.rare = d; redrawMarkers(); }
          } catch {}
        });
        es.addEventListener('storage', e => {
          try {
            const d = JSON.parse(e.data);
            if (!d.error) { pzData.storage = d; redrawMarkers(); }
          } catch {}
        });
        es.onopen = () => { _sseConnected = true; };
        es.onerror = () => { _sseConnected = false; es.close(); setTimeout(connectSSE, 10000); };
      }
      connectSSE();

      // Fallback poll — catches zombies data (not on SSE) and acts as backup if SSE drops
      setInterval(() => { if (!_sseConnected) loadData(); else loadZombies(); }, 15000);
    }

    async function loadData() {
      try {
        const [statusRes, overlayRes, vehiclesRes, zombiesRes, rareRes, storageRes] = await Promise.all([
          fetch(`${API_BASE}/api/pz/status`),
          fetch(`${API_BASE}/api/pz/overlays`),
          fetch(`${API_BASE}/api/pz/vehicles`),
          fetch(`${API_BASE}/api/pz/zombies`),
          fetch(`${API_BASE}/api/pz/rare`),
          fetch(`${API_BASE}/api/pz/storage`),
        ]);
        const status = await statusRes.json();
        const overlays = await overlayRes.json();
        const vehiclesData = await vehiclesRes.json();
        const zombiesData = await zombiesRes.json();
        const rareData = await rareRes.json();
        const storageData = await storageRes.json();
        if (!status.error) pzData.players = status.players || [];
        if (!overlays.error) pzData.overlays = overlays;
        if (!vehiclesData.error) pzData.overlays.vehicles = vehiclesData.vehicles || [];
        if (!rareData.error) pzData.rare = rareData;
        if (!storageData.error) pzData.storage = storageData;
        pzData.liveCells = zombiesData.cells || [];
        redrawMarkers();
        updateStatus();
      } catch(e) {
        document.getElementById('status').textContent = 'Offline';
      }
    }

    function updateStatus() {
      const n = (pzData.players || []).filter(p => p.isOnline !== false).length;
      document.getElementById('status').textContent =
        `${n} online · updated ${new Date().toLocaleTimeString()}`;
    }

    async function loadZombies() {
      try {
        const d = await fetch(`${API_BASE}/api/pz/zombies`).then(r => r.json());
        pzData.liveCells = d.cells || [];
        if (document.getElementById('show-heatmap')?.checked) {
          drawHeatmap(document.getElementById('heatmap-canvas'), (pzData.overlays || {}).density || [], pzData.liveCells);
        }
      } catch {}
    }

    const TOGGLE_IDS = ['show-players','show-vehicles','show-wrecks','show-deaths','show-campfires','show-farming','show-traps','show-towns','show-heatmap','show-rare','show-crates'];
    const TOGGLE_DEFAULTS = { 'show-players': true, 'show-campfires': true };

    function saveToggles() {
      const state = {};
      TOGGLE_IDS.forEach(id => { state[id] = document.getElementById(id)?.checked ?? false; });
      localStorage.setItem('pz-iso-toggles', JSON.stringify(state));
    }

    function restoreToggles() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem('pz-iso-toggles') || '{}'); } catch(_) {}
      TOGGLE_IDS.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.checked = id in saved ? saved[id] : (TOGGLE_DEFAULTS[id] ?? false);
      });
    }

    window.saveToggles = saveToggles;
    window.redrawMarkers = redrawMarkers;
    restoreToggles();
    init();
  </script>
</body>
</html>
